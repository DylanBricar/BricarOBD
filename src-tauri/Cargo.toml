[package]
name = "bricarobd"
version = "2.0.19"
description = "BricarOBD - Outil de diagnostic automobile OBD-II"
authors = ["BricarOBD"]
edition = "2021"

[lib]
name = "bricarobd_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["desktop"]
desktop = ["dep:serialport"]
mobile = ["dep:btleplug", "dep:futures", "dep:reqwest", "dep:sha2"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }

# Desktop only — serial port
serialport = { version = "4.10", optional = true }

# BLE for Bluetooth ELM327 (mobile only)
btleplug = { version = "0.13", optional = true }
futures = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
sha2 = { version = "0.11", optional = true }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
