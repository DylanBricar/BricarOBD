name: Auto Release on Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '.github/workflows/*.yml'

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  bump-and-tag:
    needs: [quality]
    runs-on: ubuntu-latest
    name: Bump version & create tag
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v2.0.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST_TAG"

      - name: Bump patch version
        id: bump
        run: |
          TAG="${{ steps.get_tag.outputs.latest_tag }}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping: $TAG -> $NEW_TAG"

      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" src-tauri/tauri.conf.json
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml
          sed -i "/^name = \"bricarobd\"$/ { n; s/^version = \"[^\"]*\"/version = \"$NEW_VERSION\"/; }" src-tauri/Cargo.lock

      - name: Commit version bump & create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Create release once
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          gh release create "$NEW_TAG" \
            --verify-tag \
            --title "BricarOBD $NEW_TAG" \
            --notes "Automated multi-platform release for BricarOBD $NEW_TAG."
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${NEW_TAG}" --jq .id)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════
  # Desktop builds (macOS, Windows, Linux)
  # ═══════════════════════════════════════════
  build-desktop:
    needs: [bump-and-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            name: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            name: macOS (Intel)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            name: Windows (x64)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            name: Linux (x64)

    runs-on: ${{ matrix.platform }}
    name: Desktop — ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Download database from release assets
        run: |
          mkdir -p src-tauri/data
          curl --fail --show-error --location --retry 3 -o src-tauri/data/bricarobd.db "https://github.com/${{ github.repository }}/releases/download/db-v1/bricarobd.db"
        shell: bash

      - name: Verify database
        run: |
          if [ -f "src-tauri/data/bricarobd.db" ]; then
            SIZE=$(stat -f%z "src-tauri/data/bricarobd.db" 2>/dev/null || stat -c%s "src-tauri/data/bricarobd.db" 2>/dev/null || echo "0")
            echo "Database found: $(du -h src-tauri/data/bricarobd.db | cut -f1) ($SIZE bytes)"
            if [ "$SIZE" -lt 100000000 ]; then
              echo "ERROR: Database too small ($SIZE bytes) — likely truncated download!"
              exit 1
            fi
            EXPECTED_SHA="fccab50a9e422588d20c0e36737a3056b3b0dcca9ec6f8909a4900cfd34f9699"
            ACTUAL_SHA=$(node -e "const fs=require('fs'),c=require('crypto');const h=c.createHash('sha256');h.update(fs.readFileSync('src-tauri/data/bricarobd.db'));process.stdout.write(h.digest('hex'))")
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERROR: Database SHA-256 mismatch: $ACTUAL_SHA"
              exit 1
            fi
          else
            echo "ERROR: Database not found!"
            exit 1
          fi
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.bump-and-tag.outputs.release_id }}
          tagName: ${{ needs.bump-and-tag.outputs.new_tag }}
          retryAttempts: 5
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  # ═══════════════════════════════════════════
  # Android build (.apk)
  # ═══════════════════════════════════════════
  build-android:
    needs: [bump-and-tag, build-desktop]
    runs-on: ubuntu-latest
    name: Android — APK

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Download database
        run: |
          mkdir -p src-tauri/data
          curl --fail --show-error --location --retry 3 -o src-tauri/data/bricarobd.db "https://github.com/${{ github.repository }}/releases/download/db-v1/bricarobd.db"

      - name: Verify database checksum
        shell: bash
        run: |
          EXPECTED_SHA="fccab50a9e422588d20c0e36737a3056b3b0dcca9ec6f8909a4900cfd34f9699"
          ACTUAL_SHA=$(node -e "const fs=require('fs'),c=require('crypto');const h=c.createHash('sha256');h.update(fs.readFileSync('src-tauri/data/bricarobd.db'));process.stdout.write(h.digest('hex'))")
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Tauri Android
        run: cargo tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Build Android APK
        run: cargo tauri android build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.bump-and-tag.outputs.new_tag }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
