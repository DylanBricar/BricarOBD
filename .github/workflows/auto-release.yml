name: Auto Release on Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - ".github/workflows/*.yml"
      - ".github/dependabot.yml"

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  bump-and-tag:
    needs: [quality]
    runs-on: ubuntu-latest
    name: Bump version & create tag
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      new_version: ${{ steps.bump.outputs.new_version }}
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v2.0.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $LATEST_TAG"

      - name: Bump patch version
        id: bump
        run: |
          TAG="${{ steps.get_tag.outputs.latest_tag }}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Bumping: $TAG -> $NEW_TAG"

      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" src-tauri/tauri.conf.json
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"$NEW_VERSION\"/" src-tauri/Cargo.toml
          sed -i "/^name = \"bricarobd\"$/ { n; s/^version = \"[^\"]*\"/version = \"$NEW_VERSION\"/; }" src-tauri/Cargo.lock

      - name: Commit version bump & create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push
          git tag "${{ steps.bump.outputs.new_tag }}"
          git push origin "${{ steps.bump.outputs.new_tag }}"

      - name: Create release once
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${NEW_TAG}" >/dev/null
          RELEASE_ID=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$NEW_TAG" \
            -f name="BricarOBD $NEW_TAG" \
            -f body="Automated multi-platform release for BricarOBD $NEW_TAG." \
            -F draft=true \
            --jq '.id')
          test -n "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════
  # Desktop builds (macOS, Windows, Linux)
  # ═══════════════════════════════════════════
  build-desktop:
    needs: [bump-and-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            name: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            name: macOS (Intel)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            name: Windows (x64)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            name: Linux (x64)

    runs-on: ${{ matrix.platform }}
    name: Desktop — ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Download database from release assets
        run: |
          mkdir -p src-tauri/data
          curl --fail --show-error --location --retry 3 -o src-tauri/data/bricarobd.db "https://github.com/${{ github.repository }}/releases/download/db-v1/bricarobd.db"
        shell: bash

      - name: Verify database
        run: |
          if [ -f "src-tauri/data/bricarobd.db" ]; then
            SIZE=$(stat -f%z "src-tauri/data/bricarobd.db" 2>/dev/null || stat -c%s "src-tauri/data/bricarobd.db" 2>/dev/null || echo "0")
            echo "Database found: $(du -h src-tauri/data/bricarobd.db | cut -f1) ($SIZE bytes)"
            if [ "$SIZE" -lt 100000000 ]; then
              echo "ERROR: Database too small ($SIZE bytes) — likely truncated download!"
              exit 1
            fi
            EXPECTED_SHA="fccab50a9e422588d20c0e36737a3056b3b0dcca9ec6f8909a4900cfd34f9699"
            ACTUAL_SHA=$(node -e "const fs=require('fs'),c=require('crypto');const h=c.createHash('sha256');h.update(fs.readFileSync('src-tauri/data/bricarobd.db'));process.stdout.write(h.digest('hex'))")
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERROR: Database SHA-256 mismatch: $ACTUAL_SHA"
              exit 1
            fi
          else
            echo "ERROR: Database not found!"
            exit 1
          fi
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.bump-and-tag.outputs.release_id }}
          tagName: ${{ needs.bump-and-tag.outputs.new_tag }}
          releaseDraft: true
          retryAttempts: 5
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  # ═══════════════════════════════════════════
  # Android build (.apk)
  # ═══════════════════════════════════════════
  build-android:
    needs: [bump-and-tag, build-desktop]
    if: vars.ANDROID_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    name: Android — APK

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Init Tauri Android
        run: pnpm exec tauri android init --ci
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Configure Android OBD bridge
        run: node scripts/configure-android-obd-bridge.mjs

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          chmod 600 "$RUNNER_TEMP/android-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-release.jks"
          SETTINGS_PATH=$(find src-tauri/gen/android -type f -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS_PATH"
          ANDROID_PROJECT=$(dirname "$SETTINGS_PATH")
          node scripts/configure-android-signing.mjs \
            "$ANDROID_PROJECT/app/build.gradle.kts" \
            "$ANDROID_PROJECT/keystore.properties"
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build Android APK
        run: pnpm exec tauri android build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: Verify signed Android APK
        id: android-apk
        shell: bash
        run: |
          APK=$(find src-tauri/gen/android -type f \
            -path '*/app/build/outputs/apk/universal/release/app-universal-release.apk' \
            -print -quit)
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.bump-and-tag.outputs.new_tag }}
          fail_on_unmatched_files: true
          files: ${{ steps.android-apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════
  # iOS build (.ipa) — enabled once Apple-issued credentials are configured
  # ═══════════════════════════════════════════
  build-ios:
    needs: [bump-and-tag, build-desktop]
    if: vars.IOS_SIGNING_ENABLED == 'true'
    runs-on: macos-15
    name: iOS — signed IPA

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-and-tag.outputs.new_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Tauri iOS
        run: pnpm exec tauri ios init --ci

      - name: Build signed iOS IPA
        run: pnpm exec tauri ios build --export-method app-store-connect
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}

      - name: Verify signed iOS IPA
        shell: bash
        run: |
          IPA=$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$IPA"
          mkdir -p "$RUNNER_TEMP/ipa"
          ditto -x -k "$IPA" "$RUNNER_TEMP/ipa"
          APP=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          test -f "$APP/embedded.mobileprovision"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Upload iOS IPA to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.bump-and-tag.outputs.new_tag }}
          fail_on_unmatched_files: true
          files: src-tauri/gen/apple/build/arm64/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    needs: [bump-and-tag, build-desktop, build-android, build-ios]
    if: >-
      always() &&
      needs.bump-and-tag.result == 'success' &&
      needs.build-desktop.result == 'success' &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')
    runs-on: ubuntu-latest
    name: Verify published desktop release
    steps:
      - name: Verify installers and updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.bump-and-tag.outputs.new_tag }}
          RELEASE_VERSION: ${{ needs.bump-and-tag.outputs.new_version }}
          ANDROID_SIGNING_ENABLED: ${{ vars.ANDROID_SIGNING_ENABLED }}
          IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
        run: |
          ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          require_asset() {
            if ! grep -Fxq "$1" <<< "$ASSETS"; then
              echo "ERROR: missing release asset: $1"
              exit 1
            fi
          }

          require_asset "BricarOBD_${RELEASE_VERSION}_aarch64.dmg"
          require_asset "BricarOBD_${RELEASE_VERSION}_aarch64.app.tar.gz"
          require_asset "BricarOBD_${RELEASE_VERSION}_aarch64.app.tar.gz.sig"
          require_asset "BricarOBD_${RELEASE_VERSION}_x64.dmg"
          require_asset "BricarOBD_${RELEASE_VERSION}_x64.app.tar.gz"
          require_asset "BricarOBD_${RELEASE_VERSION}_x64.app.tar.gz.sig"
          require_asset "BricarOBD_${RELEASE_VERSION}_amd64.AppImage"
          require_asset "BricarOBD_${RELEASE_VERSION}_amd64.AppImage.sig"
          require_asset "BricarOBD_${RELEASE_VERSION}_amd64.deb"
          require_asset "BricarOBD_${RELEASE_VERSION}_amd64.deb.sig"
          require_asset "BricarOBD_${RELEASE_VERSION}_x64-setup.exe"
          require_asset "BricarOBD_${RELEASE_VERSION}_x64-setup.exe.sig"
          require_asset "BricarOBD_${RELEASE_VERSION}_x64_en-US.msi"
          require_asset "BricarOBD_${RELEASE_VERSION}_x64_en-US.msi.sig"
          require_asset "latest.json"
          if [ "$ANDROID_SIGNING_ENABLED" = "true" ]; then
            require_asset "app-universal-release.apk"
          fi
          if [ "$IOS_SIGNING_ENABLED" = "true" ]; then
            if ! grep -Eq '\.ipa$' <<< "$ASSETS"; then
              echo "Missing signed iOS IPA"
              exit 1
            fi
          fi

          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/release"
          jq -e --arg version "$RELEASE_VERSION" '
            .version == $version and
            (.platforms["darwin-aarch64"].signature | length > 0) and
            (.platforms["darwin-x86_64"].signature | length > 0) and
            (.platforms["linux-x86_64"].signature | length > 0) and
            (.platforms["windows-x86_64"].signature | length > 0)
          ' "$RUNNER_TEMP/release/latest.json"

          gh release edit "$RELEASE_TAG" --draft=false --latest
