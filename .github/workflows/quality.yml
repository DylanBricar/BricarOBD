name: Quality & Security

on:
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Frontend, Rust, and dependency audits
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.25.0

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev libdbus-1-dev pkg-config

      - name: Download and verify operations database
        shell: bash
        run: |
          mkdir -p src-tauri/data
          curl --fail --show-error --location --retry 3 -o src-tauri/data/bricarobd.db "https://github.com/${{ github.repository }}/releases/download/db-v1/bricarobd.db"
          EXPECTED_SHA="fccab50a9e422588d20c0e36737a3056b3b0dcca9ec6f8909a4900cfd34f9699"
          ACTUAL_SHA=$(node -e "const fs=require('fs'),c=require('crypto');const h=c.createHash('sha256');h.update(fs.readFileSync('src-tauri/data/bricarobd.db'));process.stdout.write(h.digest('hex'))")
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend quality
        run: |
          pnpm lint
          pnpm test
          pnpm build
          pnpm audit

      - name: Rust formatting and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-features --locked

      - name: Rust dependency audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file src-tauri/Cargo.lock
